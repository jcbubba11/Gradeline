name: Deploy assistant server

# Publishes worker/ (the small server behind the home page assistant) to Cloudflare Workers.
# Stays off until the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY secrets exist (see SETUP.md).
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-ai-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "The assistant server is off until the secrets are added (see SETUP.md)."; echo "ready=no" >> "$GITHUB_OUTPUT"
          else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'yes'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: "22"
      - name: Install and test
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        run: npm ci && npm test
      - name: Deploy
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        run: |
          npx wrangler deploy
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
