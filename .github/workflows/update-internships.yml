name: Update internship listings

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-internships
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch postings
        env:
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python3 tracker/fetch.py
      - name: Commit if anything changed
        run: |
          git config user.name "gradeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/internships/data.json tracker/last_run.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update internship listings"
            git push
          fi
